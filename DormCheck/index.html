<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dorm Check</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dorm Check">
  <meta name="theme-color" content="#F8FAFC">
  <style>
    :root {
      --brand-primary: #172554;
      --brand-accent: #2563EB;
      --brand-accent-soft: #EAF2FF;
      --brand-surface: #FFFFFF;
      --brand-bg: #F4F7FC;
      --brand-border: #DFE7F2;
      --brand-border-subtle: #F1F5F9;

      --status-green: #16A34A;
      --status-green-bg: #DCFCE7;
      --status-green-border: #86EFAC;

      --status-red: #DC2626;
      --status-red-bg: #FEE2E2;
      --status-red-border: #FCA5A5;

      --status-amber: #D97706;
      --status-amber-bg: #FEF3C7;
      --status-amber-border: #FCD34D;

      --status-purple: #6D4AE8;
      --status-purple-bg: #F0ECFF;
      --status-purple-border: #D8B4FE;

      --text-main: #0F172A;
      --text-muted: #64748B;
      --text-subtle: #94A3B8;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    input, textarea, select { user-select: auto; }
    body {
      font-family: var(--font-family); background-color: var(--brand-bg); color: var(--text-main);
      line-height: 1.4; padding-bottom: calc(var(--safe-bottom) + 140px); min-height: 100vh;
    }
    .ios-header {
      position: sticky; top: 0; z-index: 90;
      background: rgba(244, 247, 252, 0.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: calc(var(--safe-top) + 8px) 16px 12px 16px; border-bottom: 1px solid var(--brand-border);
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .brand-badge-group { display: flex; align-items: center; gap: 8px; }
    .app-title { font-size: 19px; font-weight: 700; color: var(--brand-primary); letter-spacing: -0.3px; display: flex; align-items: center; gap: 6px; }
    .session-pill { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #E2E8F0; color: #475569; }
    .session-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
    .session-badge.draft { background-color: var(--brand-accent-soft); color: var(--brand-accent); border: 1px solid #BFDBFE; }
    .session-badge.submitted { background-color: var(--status-green-bg); color: var(--status-green); border: 1px solid var(--status-green-border); }

    .date-nav-bar {
      display: flex; align-items: center; justify-content: space-between; background: var(--brand-surface);
      border: 1px solid var(--brand-border); border-radius: 12px; padding: 4px 6px; margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .date-display-trigger {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 15px; font-weight: 600; color: var(--brand-primary); cursor: pointer; padding: 6px 4px;
    }
    .date-display-trigger svg { width: 17px; height: 17px; fill: var(--brand-accent); }
    .date-step-btn {
      background: transparent; border: none; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; color: var(--text-muted); cursor: pointer;
    }
    .date-step-btn:active { background: var(--brand-border-subtle); }
    .date-step-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .native-date-hidden { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }

    .search-container { position: relative; }
    .search-input {
      width: 100%; height: 38px; padding: 8px 34px; background: #E9EEF6; border: 1px solid transparent; border-radius: 10px;
      font-size: 15px; font-family: var(--font-family); color: var(--text-main); outline: none; transition: all 0.15s ease;
    }
    .search-input:focus { background: #FFFFFF; border-color: var(--brand-accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
    .search-icon { position: absolute; left: 10px; top: 10px; width: 17px; height: 17px; fill: var(--text-subtle); pointer-events: none; }
    .search-clear-btn {
      position: absolute; right: 10px; top: 9px; width: 20px; height: 20px; background: var(--text-subtle); color: #fff;
      border: none; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 12px; cursor: pointer;
    }

    .toolbar-card {
      margin: 10px 16px 4px 16px; background: var(--brand-surface); border: 1px solid var(--brand-border);
      border-radius: 14px; padding: 10px 12px; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .toolbar-stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .stat-chip {
      display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 10px; border-radius: 9px;
      font-size: 14px; font-weight: 600; text-align: center;
    }
    .stat-chip-green { background-color: var(--status-green-bg); color: var(--status-green); border: 1px solid var(--status-green-border); }
    .stat-chip-red { background-color: var(--status-red-bg); color: var(--status-red); border: 1px solid var(--status-red-border); }
    .toolbar-actions-row { display: flex; gap: 8px; }
    .btn-toolbar-action {
      flex: 1; background: #F1F5F9; color: var(--brand-primary); border: 1px solid var(--brand-border);
      font-size: 13px; font-weight: 600; padding: 8px 10px; border-radius: 9px; cursor: pointer; min-height: 40px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.1s ease;
    }
    .btn-toolbar-action:active { background: #E2E8F0; transform: scale(0.98); }
    .btn-toolbar-action.action-green { background: var(--status-green-bg); color: var(--status-green); border-color: var(--status-green-border); }
    .btn-toolbar-action.action-amber { background: var(--status-amber-bg); color: var(--status-amber); border-color: var(--status-amber-border); }
    .btn-toolbar-action.action-purple { background: var(--status-purple-bg); color: var(--status-purple); border-color: var(--status-purple-border); }

    .roster-container { padding: 8px 16px 20px 16px; }
    .student-card {
      background: var(--brand-surface); border: 1px solid var(--brand-border); border-radius: 14px; padding: 10px 12px;
      margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }
    .student-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; padding-right: 8px; }
    .student-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: #E2E8F0; color: #475569;
      font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .student-details { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .student-name { font-size: 15px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .tag-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; width: fit-content; }
    .badge-permission { background-color: var(--status-amber-bg); color: var(--status-amber); border: 1px solid var(--status-amber-border); }
    .badge-overnight { background-color: var(--status-purple-bg); color: var(--status-purple); border: 1px solid var(--status-purple-border); }

    .toggle-segmented { display: inline-flex; background: #E9EEF6; border-radius: 10px; padding: 2px; gap: 2px; flex-shrink: 0; }
    .toggle-segment-btn {
      border: none; background: transparent; padding: 7px 11px; font-size: 13px; font-weight: 600; border-radius: 8px;
      color: var(--text-muted); cursor: pointer; min-height: 40px; display: inline-flex; align-items: center; justify-content: center;
      gap: 4px; transition: all 0.15s ease; white-space: nowrap;
    }
    .toggle-segment-btn.active-green { background: var(--status-green); color: #FFFFFF; box-shadow: 0 1px 3px rgba(22, 163, 74, 0.3); }
    .toggle-segment-btn.active-red { background: var(--status-red); color: #FFFFFF; box-shadow: 0 1px 3px rgba(220, 38, 38, 0.3); }

    .exempt-label { font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 8px; display: flex; align-items: center; gap: 4px; }
    .exempt-label.amber { color: var(--status-amber); background: var(--status-amber-bg); }
    .exempt-label.purple { color: var(--status-purple); background: var(--status-purple-bg); }

    .floating-review-bar {
      position: fixed; bottom: calc(var(--safe-bottom) + 64px); left: 16px; right: 16px; z-index: 85; pointer-events: none;
    }
    .btn-floating-submit {
      pointer-events: auto; width: 100%; background: var(--brand-accent); color: #FFFFFF; border: none; font-size: 16px;
      font-weight: 700; padding: 13px 18px; border-radius: 14px; cursor: pointer; min-height: 48px; display: flex;
      align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
      transition: transform 0.1s ease, background 0.15s ease;
    }
    .btn-floating-submit:active { transform: scale(0.98); background: #1D4ED8; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--safe-bottom) + 58px); padding-bottom: var(--safe-bottom);
      background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border-top: 1px solid var(--brand-border); display: flex; justify-content: space-around; align-items: center; z-index: 95;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      color: var(--text-subtle); text-decoration: none; cursor: pointer; height: 52px;
    }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    .nav-item span { font-size: 11px; font-weight: 600; }
    .nav-item.active { color: var(--brand-accent); }
    .nav-item.active svg { fill: var(--brand-accent); }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); z-index: 100; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: var(--brand-bg); width: 100%; max-width: 500px; max-height: 88vh; border-radius: 22px 22px 0 0;
      padding: 12px 18px calc(var(--safe-bottom) + 20px) 18px; display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.2); animation: sheetSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes sheetSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-handle { width: 40px; height: 5px; background: #CBD5E1; border-radius: 3px; margin: 0 auto 10px auto; }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .sheet-title { font-size: 18px; font-weight: 700; color: var(--brand-primary); }
    .sheet-close-btn {
      background: #E2E8F0; border: none; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center;
      justify-content: center; font-size: 15px; font-weight: 700; color: #475569; cursor: pointer;
    }
    .sheet-content { overflow-y: auto; flex: 1; padding-bottom: 12px; }

    .history-section {
      background: var(--brand-surface); border: 1px solid var(--brand-border); border-radius: 14px; padding: 14px; margin-bottom: 12px;
    }
    .history-section h3 { font-size: 16px; font-weight: 700; color: var(--brand-primary); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .names-pill-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .name-pill { font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 7px; display: inline-flex; align-items: center; gap: 4px; }
    .name-pill.red { background: var(--status-red-bg); color: var(--status-red); border: 1px solid var(--status-red-border); }
    .name-pill.purple { background: var(--status-purple-bg); color: var(--status-purple); border: 1px solid var(--status-purple-border); }
    .name-pill.amber { background: var(--status-amber-bg); color: var(--status-amber); border: 1px solid var(--status-amber-border); }
    .name-pill.green { background: var(--status-green-bg); color: var(--status-green); border: 1px solid var(--status-green-border); }

    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.3px; }
    .form-input, .form-textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--brand-border); font-family: var(--font-family); font-size: 15px; background: #FFFFFF; color: var(--text-main); outline: none;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--brand-accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
    .form-textarea { min-height: 110px; resize: vertical; }
    .btn-primary {
      width: 100%; background: var(--brand-accent); color: #FFFFFF; border: none; font-size: 16px; font-weight: 700;
      padding: 12px; border-radius: 12px; cursor: pointer; min-height: 46px; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-primary:active { opacity: 0.88; }
    .btn-success { background: var(--status-green); box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25); }
    .btn-secondary {
      background: #E2E8F0; color: #334155; border: none; font-size: 14px; font-weight: 600; padding: 8px 12px;
      border-radius: 8px; cursor: pointer; min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    }
    .leaderboard-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--brand-border-subtle); font-size: 14px; font-weight: 500; }
    .leaderboard-item:last-child { border-bottom: none; }
    .badge-count { font-weight: 700; padding: 3px 8px; border-radius: 8px; font-size: 12px; }

    /* Responsive layouts for narrow phones and wider iPad screens */
    html, body { width: 100%; max-width: 100%; overflow-x: clip; }
    #tab-toolbar, .toolbar-card, .roster-container, .student-card, .student-left,
    .bottom-nav, .nav-item, .toggle-segmented { min-width: 0; }
    .toolbar-card { width: auto; }
    .toolbar-actions-row { min-width: 0; }
    .btn-toolbar-action { min-width: 0; white-space: normal; text-align: center; line-height: 1.25; }
    .student-name { overflow-wrap: anywhere; }
    .toggle-segment-btn { min-width: 0; white-space: normal; text-align: center; line-height: 1.2; }
    .btn-floating-submit { min-width: 0; flex-wrap: wrap; white-space: normal; text-align: center; line-height: 1.25; }
    .btn-floating-submit > span { min-width: 0; }
    .nav-item span { white-space: nowrap; }

    @media (max-width: 600px) {
      .toolbar-card { margin: 10px 12px 4px; padding: 10px; }
      .toolbar-stats-row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .stat-chip { min-width: 0; gap: 4px; padding: 8px 5px; font-size: 13px; }
      .toolbar-actions-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .toolbar-actions-row > :only-child { grid-column: 1 / -1; }
      .btn-toolbar-action { min-height: 44px; padding: 7px 6px; font-size: 12px; }
      .roster-container { padding: 8px 12px 20px; }
      .student-card {
        display: grid; grid-template-columns: minmax(0, 1fr); justify-content: initial; align-items: stretch;
        gap: 9px; padding: 12px; margin-bottom: 8px;
      }
      .student-left { width: 100%; padding-right: 0; }
      .student-details { flex: 1; }
      .student-name { white-space: normal; }
      .toggle-segmented { display: grid; width: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toggle-segment-btn { width: 100%; min-height: 44px; padding: 8px 4px; font-size: 13px; }
      .exempt-label { justify-self: start; }
      .floating-review-bar { left: 12px; right: 12px; }
      .btn-floating-submit { padding: 12px 10px; gap: 5px; font-size: 15px; }
      .bottom-nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); justify-content: initial; width: 100%; }
      .nav-item { width: 100%; overflow: hidden; }
      .nav-item span { font-size: 10px; }
    }

    @media (max-width: 360px) {
      .toolbar-actions-row, .toolbar-stats-row { grid-template-columns: minmax(0, 1fr); }
      .nav-item svg { width: 20px; height: 20px; }
    }


    .permission-icon { width: 15px; height: 15px; fill: currentColor; flex: 0 0 auto; }
    .badge-permission .permission-icon { width: 13px; height: 13px; }
    .ios-header { box-shadow: 0 4px 18px rgba(36, 59, 104, .045); }
    .date-nav-bar, .toolbar-card, .student-card { box-shadow: 0 4px 14px rgba(36, 59, 104, .055); }
    .student-card { animation: cardEnter .32s cubic-bezier(.2,.8,.2,1) both; }
    .student-card:nth-child(2) { animation-delay: 20ms; }
    .student-card:nth-child(3) { animation-delay: 40ms; }
    .student-card:nth-child(4) { animation-delay: 60ms; }
    .student-card:nth-child(5) { animation-delay: 80ms; }
    .student-card:nth-child(6) { animation-delay: 100ms; }
    .student-card:nth-child(7) { animation-delay: 120ms; }
    .student-card:nth-child(8) { animation-delay: 140ms; }
    @keyframes cardEnter { from { opacity: 0; transform: translateY(7px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .btn-toolbar-action, .toggle-segment-btn, .nav-item, .btn-floating-submit { transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease, background-color .18s ease, color .18s ease; }
    .btn-toolbar-action:active, .toggle-segment-btn:active { transform: scale(.96); }
    .btn-floating-submit { background: linear-gradient(115deg, #286BEB, #584FE2); box-shadow: 0 7px 20px rgba(54, 91, 210, .28); }
    .nav-item.active svg { filter: drop-shadow(0 2px 4px rgba(37,99,235,.22)); }
    .empty-state { animation: emptyEnter .35s ease both; }
    @keyframes emptyEnter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header class="ios-header">
    <div class="header-top">
      <div class="brand-badge-group">
        <span class="app-title">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>
          Dorm Check
        </span>
        <span class="session-pill" id="session-type-pill">Devices</span>
      </div>
      <span class="session-badge draft" id="session-badge">Draft</span>
    </div>

    <!-- Date Navigation & Picker Bar -->
    <div class="date-nav-bar" id="date-nav-bar">
      <button class="date-step-btn" onclick="StandaloneApp.stepDate(-1)" aria-label="Previous Day">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <div class="date-display-trigger" onclick="StandaloneApp.triggerDatePicker()">
        <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
        <span id="date-display-text">Today</span>
      </div>
      <input type="date" id="native-date-picker" class="native-date-hidden" onchange="StandaloneApp.onDatePicked(this.value)" />
      <button class="date-step-btn" onclick="StandaloneApp.stepDate(1)" aria-label="Next Day">
        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
    </div>

    <!-- Search Input -->
    <div class="search-container">
      <svg class="search-icon" viewBox="0 0 24 24">
        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input type="text" id="global-search" class="search-input" placeholder="Search student name..." autocomplete="off" />
      <button id="search-clear-btn" class="search-clear-btn" onclick="StandaloneApp.clearSearch()">&times;</button>
    </div>
  </header>

  <!-- Dynamic Toolbar -->
  <div id="tab-toolbar"></div>

  <!-- Roster Container -->
  <main class="roster-container" id="roster-container"></main>

  <!-- Floating Review Bar -->
  <div class="floating-review-bar" id="bottom-action-bar" style="display:none;"></div>

  <!-- Bottom Nav Tabs -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active" data-tab="devices">
      <svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
      <span>Devices</span>
    </a>
    <a href="#" class="nav-item" data-tab="attendance">
      <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
      <span>Attendance</span>
    </a>
    <a href="#" class="nav-item" data-tab="history">
      <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      <span>History</span>
    </a>
    <a href="#" class="nav-item" data-tab="students">
      <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      <span>Students</span>
    </a>
  </nav>

  <!-- Slide-Up Modal Drawer -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2 class="sheet-title" id="modal-title">Review</h2>
        <button class="sheet-close-btn" id="modal-close-btn">&times;</button>
      </div>
      <div class="sheet-content" id="modal-body"></div>
    </div>
  </div>

  <script>
    const DB = {
      KEY: 'dorm_check_standalone_db_v1',
      getData() {
        const raw = localStorage.getItem(this.KEY);
        if (raw) {
          try { return JSON.parse(raw); } catch (e) {}
        }
        const initial = {
          students: [],
          tags: {
            device_permission: [],
            overnight: []
          },
          device_sessions: {},
          attendance_sessions: {}
        };
        localStorage.setItem(this.KEY, JSON.stringify(initial));
        return initial;
      },
      save(data) {
        localStorage.setItem(this.KEY, JSON.stringify(data));
      }
    };

    const StandaloneApp = {
      state: {
        currentTab: 'devices',
        selectedDate: new Date().toISOString().split('T')[0],
        historyViewMode: 'daily',
        searchQuery: '',
        deviceDraftMarkings: {},
        attendanceDraftMarkings: {}
      },

      init() {
        document.querySelectorAll('.nav-item').forEach(item => {
          item.addEventListener('click', (e) => {
            e.preventDefault();
            this.switchTab(item.getAttribute('data-tab'));
          });
        });

        const searchInput = document.getElementById('global-search');
        const clearBtn = document.getElementById('search-clear-btn');
        searchInput.addEventListener('input', (e) => {
          this.state.searchQuery = e.target.value.toLowerCase().trim();
          if (clearBtn) clearBtn.style.display = this.state.searchQuery ? 'flex' : 'none';
          this.renderCurrentTab();
        });

        document.getElementById('modal-close-btn').addEventListener('click', () => this.closeModal());
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
          if (e.target.id === 'modal-overlay') this.closeModal();
        });

        this.updateDateDisplay();
        this.switchTab('devices');
      },

      getInitials(name) {
        if (!name) return '??';
        const parts = name.trim().split(/\s+/);
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      },

      updateDateDisplay() {
        const displayText = document.getElementById('date-display-text');
        const navBar = document.getElementById('date-nav-bar');
        if (!displayText) return;

        if (this.state.currentTab === 'students') {
          if (navBar) navBar.style.display = 'none';
          return;
        } else {
          if (navBar) navBar.style.display = 'flex';
        }

        const todayStr = new Date().toISOString().split('T')[0];
        const yestDate = new Date();
        yestDate.setDate(yestDate.getDate() - 1);
        const yestStr = yestDate.toISOString().split('T')[0];

        const currentStr = this.state.selectedDate;
        const [y, m, d] = currentStr.split('-');
        const dt = new Date(y, m - 1, d);
        const formatted = dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

        if (currentStr === todayStr) {
          displayText.innerHTML = `<strong>Today</strong>, ${formatted.split(',')[1] || formatted}`;
        } else if (currentStr === yestStr) {
          displayText.innerHTML = `<strong>Yesterday</strong>, ${formatted.split(',')[1] || formatted}`;
        } else {
          displayText.textContent = formatted;
        }

        const picker = document.getElementById('native-date-picker');
        if (picker) picker.value = currentStr;
      },

      stepDate(delta) {
        const [y, m, d] = this.state.selectedDate.split('-').map(Number);
        const cur = new Date(y, m - 1, d);
        cur.setDate(cur.getDate() + delta);
        this.state.selectedDate = cur.toISOString().split('T')[0];
        this.updateDateDisplay();
        this.renderCurrentTab();
      },

      triggerDatePicker() {
        const picker = document.getElementById('native-date-picker');
        if (picker) {
          if (picker.showPicker) picker.showPicker();
          else { picker.focus(); picker.click(); }
        }
      },

      onDatePicked(val) {
        if (!val) return;
        this.state.selectedDate = val;
        this.updateDateDisplay();
        this.renderCurrentTab();
      },

      clearSearch() {
        document.getElementById('global-search').value = '';
        const clearBtn = document.getElementById('search-clear-btn');
        if (clearBtn) clearBtn.style.display = 'none';
        this.state.searchQuery = '';
        this.renderCurrentTab();
      },

      getActiveStudents() {
        const db = DB.getData();
        return db.students
          .filter(s => s.is_active)
          .sort((a, b) => a.full_name.localeCompare(b.full_name, undefined, { sensitivity: 'base' }))
          .map(s => ({
            ...s,
            has_permission: db.tags.device_permission.includes(s.id),
            is_overnight: db.tags.overnight.includes(s.id)
          }));
      },

      switchTab(tab) {
        this.state.currentTab = tab;
        this.clearSearch();

        document.querySelectorAll('.nav-item').forEach(el => {
          if (el.getAttribute('data-tab') === tab) el.classList.add('active');
          else el.classList.remove('active');
        });

        const pill = document.getElementById('session-type-pill');
        const headerBadge = document.getElementById('session-badge');
        const bottomBar = document.getElementById('bottom-action-bar');
        bottomBar.style.display = 'none';

        this.updateDateDisplay();

        if (tab === 'devices') {
          if (pill) pill.textContent = 'Morning Devices';
          this.renderDevices();
        } else if (tab === 'attendance') {
          if (pill) pill.textContent = 'Night Roll Call';
          this.renderAttendance();
        } else if (tab === 'history') {
          if (pill) pill.textContent = 'History & Reports';
          headerBadge.style.display = 'none';
          this.renderHistory();
        } else if (tab === 'students') {
          if (pill) pill.textContent = 'Student Roster';
          headerBadge.style.display = 'none';
          this.renderStudents();
        }
      },

      // ---------- DEVICES ----------
      renderDevices() {
        const db = DB.getData();
        const date = this.state.selectedDate;
        const session = db.device_sessions[date] || { is_submitted: false, records: {} };
        const activeStudents = this.getActiveStudents();

        const headerBadge = document.getElementById('session-badge');
        headerBadge.style.display = 'inline-block';
        if (session.is_submitted) {
          headerBadge.textContent = 'Submitted';
          headerBadge.className = 'session-badge submitted';
        } else {
          headerBadge.textContent = 'Draft';
          headerBadge.className = 'session-badge draft';
        }

        if (!this.state.deviceDraftMarkings[date]) {
          this.state.deviceDraftMarkings[date] = { ...session.records };
        }
        const markings = this.state.deviceDraftMarkings[date];

        let submittedCount = 0;
        let notSubmittedCount = 0;
        let permCount = 0;

        activeStudents.forEach(s => {
          if (s.has_permission) {
            permCount++;
            return;
          }
          if (markings[s.id] === 'submitted') submittedCount++;
          else notSubmittedCount++;
        });

        document.getElementById('tab-toolbar').innerHTML = `
          <div class="toolbar-card">
            <div class="toolbar-stats-row">
              <div class="stat-chip stat-chip-green">
                <span>✓</span> <strong>${submittedCount}</strong> Submitted
              </div>
              <div class="stat-chip stat-chip-red">
          <span>✕</span> <strong>${notSubmittedCount}</strong> Not Submitted
              </div>
            </div>
            <div class="toolbar-actions-row">
              <button class="btn-toolbar-action action-amber" onclick="StandaloneApp.openManagePermissionsModal('device_permission')">
                <svg class="permission-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5.25 3.4 9.9 8 11 4.6-1.1 8-5.75 8-11V5l-8-3zm0 3.1 5 1.88V11c0 3.78-2.2 7.23-5 8.25-2.8-1.02-5-4.47-5-8.25V6.98l5-1.88z"/></svg> Permissions (${permCount})
              </button>
            </div>
          </div>
        `;

        const filtered = activeStudents.filter(s => s.full_name.toLowerCase().includes(this.state.searchQuery));
        const listContainer = document.getElementById('roster-container');

        if (filtered.length === 0) {
          listContainer.innerHTML = `<div class="empty-state" style="text-align:center; padding: 48px 24px; color: var(--text-muted);"><div style="width:54px;height:54px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(145deg,#E5EEFF,#EEE9FF);display:grid;place-items:center;color:#4F65C8;font-size:24px;">＋</div><strong style="display:block;color:var(--brand-primary);font-size:16px;margin-bottom:5px;">Your roster starts here</strong><span style="font-size:13px;">Add students one at a time or import your list.</span></div>`;
        } else {
          listContainer.innerHTML = filtered.map(s => {
            const initials = this.getInitials(s.full_name);

            if (s.has_permission) {
              return `
                <div class="student-card">
                  <div class="student-left">
                    <div class="student-avatar" style="background:#FEF3C7; color:#D97706;">${initials}</div>
                    <div class="student-details">
                      <span class="student-name">${s.full_name}</span>
                      <span class="tag-badge badge-permission"><svg class="permission-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5.25 3.4 9.9 8 11 4.6-1.1 8-5.75 8-11V5l-8-3zm0 3.1 5 1.88V11c0 3.78-2.2 7.23-5 8.25-2.8-1.02-5-4.47-5-8.25V6.98l5-1.88z"/></svg> Permission</span>
                    </div>
                  </div>
                  <span class="exempt-label amber">Exempt</span>
                </div>
              `;
            }

            const current = markings[s.id] || '';
            const isSub = current === 'submitted';
            const isNot = current === 'not_submitted';

            return `
              <div class="student-card">
                <div class="student-left">
                  <div class="student-avatar">${initials}</div>
                  <div class="student-details">
                    <span class="student-name">${s.full_name}</span>
                  </div>
                </div>
                <div class="toggle-segmented">
                  <button class="toggle-segment-btn ${isSub ? 'active-green' : ''}" onclick="StandaloneApp.toggleDeviceMark(${s.id}, 'submitted')">
                    <span>✓</span> Submitted
                  </button>
                  <button class="toggle-segment-btn ${isNot ? 'active-red' : ''}" onclick="StandaloneApp.toggleDeviceMark(${s.id}, 'not_submitted')">
                <span>✕</span> Not Submitted
                  </button>
                </div>
              </div>
            `;
          }).join('');
        }

        const bottomBar = document.getElementById('bottom-action-bar');
        bottomBar.style.display = 'block';
        bottomBar.innerHTML = `
          <button class="btn-floating-submit" onclick="StandaloneApp.openDeviceReview()">
            <span>Review Morning Collection</span>
            ${notSubmittedCount > 0 ? `<span style="opacity:0.85; font-size:14px; font-weight:600;">(${notSubmittedCount} Missing)</span>` : ''}
            <span>→</span>
          </button>
        `;
      },

      toggleDeviceMark(studentId, status) {
        const date = this.state.selectedDate;
        const markings = this.state.deviceDraftMarkings[date] || {};
        if (markings[studentId] === status) delete markings[studentId];
        else markings[studentId] = status;
        this.state.deviceDraftMarkings[date] = markings;
        this.renderDevices();
      },

      openDeviceReview() {
        const activeStudents = this.getActiveStudents();
        const date = this.state.selectedDate;
        const markings = this.state.deviceDraftMarkings[date] || {};

        let submittedCount = 0;
        let notSubmittedList = [];
        let permissionList = [];

        activeStudents.forEach(s => {
          if (s.has_permission) {
            permissionList.push(s.full_name);
            return;
          }
          if (markings[s.id] === 'submitted') {
            submittedCount++;
          } else {
            notSubmittedList.push(s.full_name);
          }
        });

        document.getElementById('modal-title').textContent = 'Morning Review — ' + this.state.selectedDate;
        document.getElementById('modal-body').innerHTML = `
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px;">
            <div class="stat-chip stat-chip-green">
              <span>✓</span> <strong>${submittedCount}</strong> Submitted
            </div>
            <div class="stat-chip stat-chip-red">
              <span>✕</span> <strong>${notSubmittedList.length}</strong> Not Submitted
            </div>
          </div>

          <div class="history-section">
            <h3 style="color: var(--status-red);">
              <span>Not Submitted Students (${notSubmittedList.length})</span>
            </h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">
              Includes unsubmitted and unmarked students defaulting to Not Submitted:
            </p>
            <div class="names-pill-list">
              ${notSubmittedList.length > 0 
                ? notSubmittedList.map(n => `<span class="name-pill red">✕ ${n}</span>`).join('') 
                : '<span style="color:var(--status-green); font-size:13px; font-weight:600;">✓ All devices successfully submitted!</span>'}
            </div>
          </div>

          ${permissionList.length > 0 ? `
            <div class="history-section">
              <h3 style="color: var(--status-amber);">
                <span>Excluded Permission Students (${permissionList.length})</span>
              </h3>
              <div class="names-pill-list">
                ${permissionList.map(n => `<span class="name-pill amber"><svg class="permission-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5.25 3.4 9.9 8 11 4.6-1.1 8-5.75 8-11V5l-8-3zm0 3.1 5 1.88V11c0 3.78-2.2 7.23-5 8.25-2.8-1.02-5-4.47-5-8.25V6.98l5-1.88z"/></svg> ${n}</span>`).join('')}
              </div>
            </div>
          ` : ''}

          <div class="form-group" style="margin-top: 10px;">
            <label class="form-label">Notes (Optional)</label>
            <input type="text" id="dev-notes" class="form-input" placeholder="e.g. All devices collected" />
          </div>

          <button class="btn-primary btn-success" style="width:100%; margin-top: 8px;" onclick="StandaloneApp.confirmDeviceSubmission()">
            ✓ Confirm Morning Submission
          </button>
        `;
        this.openModal();
      },

      confirmDeviceSubmission() {
        const db = DB.getData();
        const date = this.state.selectedDate;
        const activeStudents = this.getActiveStudents();
        const markings = this.state.deviceDraftMarkings[date] || {};
        const notes = document.getElementById('dev-notes')?.value || '';

        const finalRecords = {};
        const snapshots = {};

        activeStudents.forEach(s => {
          snapshots[s.id] = s.full_name;
          if (s.has_permission) {
            finalRecords[s.id] = 'permission';
          } else if (markings[s.id] === 'submitted') {
            finalRecords[s.id] = 'submitted';
          } else {
            finalRecords[s.id] = 'not_submitted';
          }
        });

        db.device_sessions[date] = {
          is_submitted: true,
          submitted_at: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          notes: notes,
          records: finalRecords,
          snapshots: snapshots
        };

        DB.save(db);
        this.closeModal();
        this.renderDevices();
        alert('Morning device collection submitted successfully!');
      },

      // ---------- ATTENDANCE ----------
      renderAttendance() {
        const db = DB.getData();
        const date = this.state.selectedDate;
        const session = db.attendance_sessions[date] || { is_submitted: false, records: {} };
        const activeStudents = this.getActiveStudents();

        const headerBadge = document.getElementById('session-badge');
        headerBadge.style.display = 'inline-block';
        if (session.is_submitted) {
          headerBadge.textContent = 'Submitted';
          headerBadge.className = 'session-badge submitted';
        } else {
          headerBadge.textContent = 'Draft';
          headerBadge.className = 'session-badge draft';
        }

        if (!this.state.attendanceDraftMarkings[date]) {
          this.state.attendanceDraftMarkings[date] = { ...session.records };
        }
        const markings = this.state.attendanceDraftMarkings[date];

        let presentCount = 0;
        let absentCount = 0;
        let overnightCount = 0;

        activeStudents.forEach(s => {
          if (s.is_overnight) {
            overnightCount++;
            return;
          }
          if (markings[s.id] === 'present') presentCount++;
          else absentCount++;
        });

        document.getElementById('tab-toolbar').innerHTML = `
          <div class="toolbar-card">
            <div class="toolbar-stats-row">
              <div class="stat-chip stat-chip-green">
                <span>✓</span> <strong>${presentCount}</strong> Present
              </div>
              <div class="stat-chip stat-chip-red">
                <span>✕</span> <strong>${absentCount}</strong> Absent
              </div>
            </div>
            <div class="toolbar-actions-row">
              <button class="btn-toolbar-action action-green" onclick="StandaloneApp.markAllPresent()">
                ✓ Mark All Present
              </button>
              <button class="btn-toolbar-action action-purple" onclick="StandaloneApp.openManagePermissionsModal('overnight')">
                🌙 Over-Night (${overnightCount})
              </button>
            </div>
          </div>
        `;

        const filtered = activeStudents.filter(s => s.full_name.toLowerCase().includes(this.state.searchQuery));
        const listContainer = document.getElementById('roster-container');

        if (filtered.length === 0) {
          listContainer.innerHTML = `<div class="empty-state" style="text-align:center; padding: 48px 24px; color: var(--text-muted);"><div style="width:54px;height:54px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(145deg,#E5EEFF,#EEE9FF);display:grid;place-items:center;color:#4F65C8;font-size:24px;">＋</div><strong style="display:block;color:var(--brand-primary);font-size:16px;margin-bottom:5px;">Your roster starts here</strong><span style="font-size:13px;">Add students one at a time or import your list.</span></div>`;
        } else {
          listContainer.innerHTML = filtered.map(s => {
            const initials = this.getInitials(s.full_name);

            if (s.is_overnight) {
              return `
                <div class="student-card">
                  <div class="student-left">
                    <div class="student-avatar" style="background:#F3E8FF; color:#7C3AED;">${initials}</div>
                    <div class="student-details">
                      <span class="student-name">${s.full_name}</span>
                      <span class="tag-badge badge-overnight">🌙 Over-Night</span>
                    </div>
                  </div>
                  <span class="exempt-label purple">Exempt</span>
                </div>
              `;
            }

            const current = markings[s.id] || '';
            const isPres = current === 'present';
            const isAbs = current === 'absent';

            return `
              <div class="student-card">
                <div class="student-left">
                  <div class="student-avatar">${initials}</div>
                  <div class="student-details">
                    <span class="student-name">${s.full_name}</span>
                  </div>
                </div>
                <div class="toggle-segmented">
                  <button class="toggle-segment-btn ${isPres ? 'active-green' : ''}" onclick="StandaloneApp.toggleAttendanceMark(${s.id}, 'present')">
                    <span>✓</span> Present
                  </button>
                  <button class="toggle-segment-btn ${isAbs ? 'active-red' : ''}" onclick="StandaloneApp.toggleAttendanceMark(${s.id}, 'absent')">
                    <span>✕</span> Absent
                  </button>
                </div>
              </div>
            `;
          }).join('');
        }

        const bottomBar = document.getElementById('bottom-action-bar');
        bottomBar.style.display = 'block';
        bottomBar.innerHTML = `
          <button class="btn-floating-submit" onclick="StandaloneApp.openAttendanceReview()">
            <span>Review Night Attendance</span>
            ${absentCount > 0 ? `<span style="opacity:0.85; font-size:14px; font-weight:600;">(${absentCount} Absent)</span>` : ''}
            <span>→</span>
          </button>
        `;
      },

      markAllPresent() {
        const date = this.state.selectedDate;
        const activeStudents = this.getActiveStudents();
        const markings = this.state.attendanceDraftMarkings[date] || {};

        activeStudents.forEach(s => {
          if (!s.is_overnight) {
            markings[s.id] = 'present';
          }
        });
        this.state.attendanceDraftMarkings[date] = markings;
        this.renderAttendance();
      },

      toggleAttendanceMark(studentId, status) {
        const date = this.state.selectedDate;
        const markings = this.state.attendanceDraftMarkings[date] || {};
        if (markings[studentId] === status) delete markings[studentId];
        else markings[studentId] = status;
        this.state.attendanceDraftMarkings[date] = markings;
        this.renderAttendance();
      },

      openAttendanceReview() {
        const activeStudents = this.getActiveStudents();
        const date = this.state.selectedDate;
        const markings = this.state.attendanceDraftMarkings[date] || {};

        let presentCount = 0;
        let absentList = [];
        let overnightList = [];

        activeStudents.forEach(s => {
          if (s.is_overnight) {
            overnightList.push(s.full_name);
            return;
          }
          if (markings[s.id] === 'present') {
            presentCount++;
          } else {
            absentList.push(s.full_name);
          }
        });

        document.getElementById('modal-title').textContent = 'Attendance Review — ' + this.state.selectedDate;
        document.getElementById('modal-body').innerHTML = `
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 14px;">
            <div class="stat-chip stat-chip-green" style="font-size:12px; padding:6px;">
              ✓ <strong>${presentCount}</strong> Present
            </div>
            <div class="stat-chip stat-chip-red" style="font-size:12px; padding:6px;">
              ✕ <strong>${absentList.length}</strong> Absent
            </div>
            <div class="stat-chip" style="font-size:12px; padding:6px; background:var(--status-purple-bg); color:var(--status-purple); border:1px solid var(--status-purple-border);">
              🌙 <strong>${overnightList.length}</strong> Over
            </div>
          </div>

          <div class="history-section">
            <h3 style="color: var(--status-red);">
              <span>Full Absent List (${absentList.length})</span>
            </h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">
              Includes marked and unmarked students defaulting to Absent:
            </p>
            <div class="names-pill-list">
              ${absentList.length > 0 
                ? absentList.map(n => `<span class="name-pill red">✕ ${n}</span>`).join('') 
                : '<span style="color:var(--status-green); font-size:13px; font-weight:600;">✓ All active students present!</span>'}
            </div>
          </div>

          <div class="history-section">
            <h3 style="color: var(--status-purple);">
              <span>Over-Night Students (${overnightList.length})</span>
            </h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">
              Exempt from roll call and excluded from the absent list:
            </p>
            <div class="names-pill-list">
              ${overnightList.length > 0 
                ? overnightList.map(n => `<span class="name-pill purple">🌙 ${n}</span>`).join('') 
                : '<span style="color:var(--text-muted); font-size:13px;">No students on Over-Night leave.</span>'}
            </div>
          </div>

          <div class="form-group" style="margin-top: 10px;">
            <label class="form-label">Notes (Optional)</label>
            <input type="text" id="att-notes" class="form-input" placeholder="e.g. Roll call complete at 10:00 PM" />
          </div>

          <button class="btn-primary btn-success" style="width:100%; margin-top: 8px;" onclick="StandaloneApp.confirmAttendanceSubmission()">
            ✓ Confirm Submission
          </button>
        `;
        this.openModal();
      },

      confirmAttendanceSubmission() {
        const db = DB.getData();
        const date = this.state.selectedDate;
        const activeStudents = this.getActiveStudents();
        const markings = this.state.attendanceDraftMarkings[date] || {};
        const notes = document.getElementById('att-notes')?.value || '';

        const finalRecords = {};
        const snapshots = {};

        activeStudents.forEach(s => {
          snapshots[s.id] = s.full_name;
          if (s.is_overnight) {
            finalRecords[s.id] = 'overnight';
          } else if (markings[s.id] === 'present') {
            finalRecords[s.id] = 'present';
          } else {
            finalRecords[s.id] = 'absent';
          }
        });

        db.attendance_sessions[date] = {
          is_submitted: true,
          submitted_at: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          notes: notes,
          records: finalRecords,
          snapshots: snapshots
        };

        DB.save(db);
        this.closeModal();
        this.renderAttendance();
        alert('Night attendance submitted successfully!');
      },

      // ---------- HISTORY & REPORTS ----------
      renderHistory() {
        document.getElementById('tab-toolbar').innerHTML = `
          <div class="toolbar-card" style="margin-bottom: 6px;">
            <div class="toggle-segmented" style="width:100%;">
              <button style="flex:1;" class="toggle-segment-btn ${this.state.historyViewMode === 'daily' ? 'active-green' : ''}" onclick="StandaloneApp.setHistoryMode('daily')">
                Daily Report
              </button>
              <button style="flex:1;" class="toggle-segment-btn ${this.state.historyViewMode === 'weekly' ? 'active-green' : ''}" onclick="StandaloneApp.setHistoryMode('weekly')">
                Weekly Summary
              </button>
            </div>
          </div>
        `;

        if (this.state.historyViewMode === 'daily') {
          this.renderDailyHistory();
        } else {
          this.renderWeeklyHistory();
        }
      },

      setHistoryMode(mode) {
        this.state.historyViewMode = mode;
        this.renderHistory();
      },

      renderDailyHistory() {
        const db = DB.getData();
        const date = this.state.selectedDate;
        const dev = db.device_sessions[date];
        const att = db.attendance_sessions[date];

        let devSub = 0, devNot = 0, devNotList = [], devPermList = [];
        if (dev && dev.is_submitted) {
          Object.keys(dev.records).forEach(id => {
            const st = dev.records[id];
            const name = dev.snapshots[id] || `Student #${id}`;
            if (st === 'submitted') devSub++;
            else if (st === 'not_submitted') { devNot++; devNotList.push(name); }
            else if (st === 'permission') { devPermList.push(name); }
          });
        }

        let attPres = 0, attAbs = 0, attAbsList = [], attOverList = [];
        if (att && att.is_submitted) {
          Object.keys(att.records).forEach(id => {
            const st = att.records[id];
            const name = att.snapshots[id] || `Student #${id}`;
            if (st === 'present') attPres++;
            else if (st === 'absent') { attAbs++; attAbsList.push(name); }
            else if (st === 'overnight') { attOverList.push(name); }
          });
        }

        document.getElementById('roster-container').innerHTML = `
          <!-- Morning Devices Report -->
          <div class="history-section">
            <h3>
              <span>Morning Devices</span>
              ${dev && dev.is_submitted ? `<span class="badge-count" style="background: var(--status-green-bg); color: var(--status-green); border:1px solid var(--status-green-border);">Submitted</span>` : `<span class="badge-count" style="background: #E2E8F0; color: #64748B;">Not Finalized</span>`}
            </h3>
            ${dev && dev.is_submitted ? `
              <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">Submitted at: ${dev.submitted_at || ''}</div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom: 12px;">
                <div class="stat-chip stat-chip-green">✓ ${devSub} Submitted</div>
                <div class="stat-chip stat-chip-red">✕ ${devNot} Not Sub</div>
              </div>
              <h4 style="font-size: 13px; font-weight: 700; color: var(--status-red); text-transform:uppercase; margin-top: 10px;">Not Submitted Students (${devNotList.length})</h4>
              <div class="names-pill-list">
                ${devNotList.length > 0 ? devNotList.map(n => `<span class="name-pill red">✕ ${n}</span>`).join('') : '<span style="color:var(--text-muted); font-size:13px;">None</span>'}
              </div>
              ${devPermList.length > 0 ? `
                <h4 style="font-size: 13px; font-weight: 700; color: var(--status-amber); text-transform:uppercase; margin-top: 12px;">Students with Permission (${devPermList.length})</h4>
                <div class="names-pill-list">
                  ${devPermList.map(n => `<span class="name-pill amber"><svg class="permission-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5.25 3.4 9.9 8 11 4.6-1.1 8-5.75 8-11V5l-8-3zm0 3.1 5 1.88V11c0 3.78-2.2 7.23-5 8.25-2.8-1.02-5-4.47-5-8.25V6.98l5-1.88z"/></svg> ${n}</span>`).join('')}
                </div>
              ` : ''}
              <div style="margin-top: 14px;">
                <button class="btn-secondary" style="width:100%;" onclick="StandaloneApp.reopenSession('devices', '${date}')">
                  ✎ Reopen & Edit Morning Devices
                </button>
              </div>
            ` : '<p style="color:var(--text-muted); font-size:14px;">No submitted morning devices report for this date.</p>'}
          </div>

          <!-- Night Attendance Report -->
          <div class="history-section">
            <h3>
              <span>Night Roll Call</span>
              ${att && att.is_submitted ? `<span class="badge-count" style="background: var(--status-green-bg); color: var(--status-green); border:1px solid var(--status-green-border);">Submitted</span>` : `<span class="badge-count" style="background: #E2E8F0; color: #64748B;">Not Finalized</span>`}
            </h3>
            ${att && att.is_submitted ? `
              <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">Submitted at: ${att.submitted_at || ''}</div>
              <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom: 12px;">
                <div class="stat-chip stat-chip-green" style="font-size:12px; padding:6px;">✓ ${attPres} Pres</div>
                <div class="stat-chip stat-chip-red" style="font-size:12px; padding:6px;">✕ ${attAbs} Abs</div>
                <div class="stat-chip" style="font-size:12px; padding:6px; background:var(--status-purple-bg); color:var(--status-purple); border:1px solid var(--status-purple-border);">🌙 ${attOverList.length} Over</div>
              </div>
              <h4 style="font-size: 13px; font-weight: 700; color: var(--status-red); text-transform:uppercase; margin-top: 10px;">Absent Students (${attAbsList.length})</h4>
              <div class="names-pill-list">
                ${attAbsList.length > 0 ? attAbsList.map(n => `<span class="name-pill red">✕ ${n}</span>`).join('') : '<span style="color:var(--text-muted); font-size:13px;">None</span>'}
              </div>
              <h4 style="font-size: 13px; font-weight: 700; color: var(--status-purple); text-transform:uppercase; margin-top: 12px;">Over-Night Students (${attOverList.length})</h4>
              <div class="names-pill-list">
                ${attOverList.length > 0 ? attOverList.map(n => `<span class="name-pill purple">🌙 ${n}</span>`).join('') : '<span style="color:var(--text-muted); font-size:13px;">None</span>'}
              </div>
              <div style="margin-top: 14px;">
                <button class="btn-secondary" style="width:100%;" onclick="StandaloneApp.reopenSession('attendance', '${date}')">
                  ✎ Reopen & Edit Night Attendance
                </button>
              </div>
            ` : '<p style="color:var(--text-muted); font-size:14px;">No submitted night attendance report for this date.</p>'}
          </div>
        `;
      },

      reopenSession(type, date) {
        if (!confirm(`Reopen and edit ${type} for ${date}?`)) return;
        const db = DB.getData();
        if (type === 'devices' && db.device_sessions[date]) {
          db.device_sessions[date].is_submitted = false;
        } else if (type === 'attendance' && db.attendance_sessions[date]) {
          db.attendance_sessions[date].is_submitted = false;
        }
        DB.save(db);
        this.state.selectedDate = date;
        this.switchTab(type);
      },

      renderWeeklyHistory() {
        const db = DB.getData();
        const nonSubmittersCount = {};
        const absencesCount = {};
        const overnightCount = {};

        let totalDevSub = 0, totalDevNot = 0, totalAttPres = 0, totalAttAbs = 0;

        Object.keys(db.device_sessions).forEach(d => {
          const s = db.device_sessions[d];
          if (!s.is_submitted) return;
          Object.keys(s.records).forEach(id => {
            const st = s.records[id];
            const name = s.snapshots[id] || `Student #${id}`;
            if (st === 'submitted') totalDevSub++;
            else if (st === 'not_submitted') {
              totalDevNot++;
              nonSubmittersCount[name] = (nonSubmittersCount[name] || 0) + 1;
            }
          });
        });

        Object.keys(db.attendance_sessions).forEach(d => {
          const s = db.attendance_sessions[d];
          if (!s.is_submitted) return;
          Object.keys(s.records).forEach(id => {
            const st = s.records[id];
            const name = s.snapshots[id] || `Student #${id}`;
            if (st === 'present') totalAttPres++;
            else if (st === 'absent') {
              totalAttAbs++;
              absencesCount[name] = (absencesCount[name] || 0) + 1;
            } else if (st === 'overnight') {
              overnightCount[name] = (overnightCount[name] || 0) + 1;
            }
          });
        });

        const sortedNonSub = Object.entries(nonSubmittersCount).sort((a,b) => b[1] - a[1]);
        const sortedAbs = Object.entries(absencesCount).sort((a,b) => b[1] - a[1]);
        const sortedOver = Object.entries(overnightCount).sort((a,b) => b[1] - a[1]);

        document.getElementById('roster-container').innerHTML = `
          <div class="history-section">
            <h3 style="color: var(--brand-accent);">Morning Devices Summary</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom: 12px;">
              <div class="stat-chip stat-chip-green">✓ Total: ${totalDevSub}</div>
              <div class="stat-chip stat-chip-red">✕ Missing: ${totalDevNot}</div>
            </div>
            <h4 style="font-size: 13px; font-weight: 700; color:var(--text-muted); text-transform:uppercase; margin-bottom: 6px;">Frequent Non-Submitters</h4>
            ${sortedNonSub.length > 0 ? sortedNonSub.map(([name, count]) => `
              <div class="leaderboard-item">
                <span>${name}</span>
                <span class="badge-count" style="background: var(--status-red-bg); color: var(--status-red); border:1px solid var(--status-red-border);">${count} times</span>
              </div>
            `).join('') : '<p style="color:var(--text-muted); font-size:13px;">No non-submissions recorded.</p>'}
          </div>

          <div class="history-section">
            <h3 style="color: var(--status-purple);">Night Attendance Summary</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom: 12px;">
              <div class="stat-chip stat-chip-green">✓ Total: ${totalAttPres}</div>
              <div class="stat-chip stat-chip-red">✕ Absent: ${totalAttAbs}</div>
            </div>
            <h4 style="font-size: 13px; font-weight: 700; color:var(--text-muted); text-transform:uppercase; margin-bottom: 6px;">Frequent Absences</h4>
            ${sortedAbs.length > 0 ? sortedAbs.map(([name, count]) => `
              <div class="leaderboard-item">
                <span>${name}</span>
                <span class="badge-count" style="background: var(--status-red-bg); color: var(--status-red); border:1px solid var(--status-red-border);">${count} absences</span>
              </div>
            `).join('') : '<p style="color:var(--text-muted); font-size:13px;">No absences recorded.</p>'}

            <h4 style="font-size: 13px; font-weight: 700; color:var(--text-muted); text-transform:uppercase; margin-top: 12px; margin-bottom: 6px;">Over-Night Stays</h4>
            ${sortedOver.length > 0 ? sortedOver.map(([name, count]) => `
              <div class="leaderboard-item">
                <span>${name}</span>
                <span class="badge-count" style="background: var(--status-purple-bg); color: var(--status-purple); border:1px solid var(--status-purple-border);">${count} nights</span>
              </div>
            `).join('') : '<p style="color:var(--text-muted); font-size:13px;">No overnight stays recorded.</p>'}
          </div>
        `;
      },

      // ---------- STUDENTS & TAGS ----------
      renderStudents() {
        const activeStudents = this.getActiveStudents();
        document.getElementById('tab-toolbar').innerHTML = `
          <div class="toolbar-card" style="margin-bottom:6px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size: 14px; font-weight: 700; color: var(--brand-primary);">${activeStudents.length} Active Students</span>
              <div style="display:flex; gap: 6px;">
                <button class="btn-secondary" onclick="StandaloneApp.openBulkImportModal()">+ Bulk Import</button>
                <button class="btn-secondary" style="background: var(--brand-accent); color: #fff;" onclick="StandaloneApp.openAddStudentModal()">+ Add Student</button>
              </div>
            </div>
          </div>
        `;

        const filtered = activeStudents.filter(s => s.full_name.toLowerCase().includes(this.state.searchQuery));
        const listContainer = document.getElementById('roster-container');

        if (filtered.length === 0) {
          listContainer.innerHTML = `<div class="empty-state" style="text-align:center; padding: 48px 24px; color: var(--text-muted);"><div style="width:54px;height:54px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(145deg,#E5EEFF,#EEE9FF);display:grid;place-items:center;color:#4F65C8;font-size:24px;">＋</div><strong style="display:block;color:var(--brand-primary);font-size:16px;margin-bottom:5px;">Your roster starts here</strong><span style="font-size:13px;">Add students one at a time or import your list.</span></div>`;
          return;
        }

        listContainer.innerHTML = `
          ${filtered.map(s => {
            const initials = this.getInitials(s.full_name);
            return `
              <div class="student-card">
                <div class="student-left">
                  <div class="student-avatar">${initials}</div>
                  <div class="student-details">
                    <span class="student-name">${s.full_name}</span>
                    <div style="display:flex; gap:4px; margin-top: 2px;">
                      ${s.has_permission ? `<span class="tag-badge badge-permission"><svg class="permission-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5.25 3.4 9.9 8 11 4.6-1.1 8-5.75 8-11V5l-8-3zm0 3.1 5 1.88V11c0 3.78-2.2 7.23-5 8.25-2.8-1.02-5-4.47-5-8.25V6.98l5-1.88z"/></svg> Permission</span>` : ''}
                      ${s.is_overnight ? `<span class="tag-badge badge-overnight">🌙 Over-Night</span>` : ''}
                    </div>
                  </div>
                </div>
                <div style="display:flex; gap: 6px; flex-shrink:0;">
                  <button class="btn-secondary" style="padding: 5px 8px; font-size:12px;" onclick="StandaloneApp.openEditStudentModal(${s.id}, '${s.full_name.replace(/'/g, "\\'")}')">Rename</button>
                  <button class="btn-secondary" style="padding: 5px 8px; font-size:12px; color: var(--status-red);" onclick="StandaloneApp.archiveStudent(${s.id}, '${s.full_name.replace(/'/g, "\\'")}')">Archive</button>
                </div>
              </div>
            `;
          }).join('')}

          <div style="margin-top: 20px; text-align:center;">
            <button class="btn-secondary" onclick="StandaloneApp.exportData()">Backup / Export Data (JSON)</button>
          </div>
        `;
      },

      openAddStudentModal() {
        document.getElementById('modal-title').textContent = 'Add Single Student';
        document.getElementById('modal-body').innerHTML = `
          <div class="form-group">
            <label class="form-label">Student Full Name</label>
            <input type="text" id="new-name" class="form-input" placeholder="Enter student name" autofocus />
          </div>
          <button class="btn-primary" style="width:100%; margin-top: 8px;" onclick="StandaloneApp.submitAddStudent()">Create Student</button>
        `;
        this.openModal();
      },

      submitAddStudent() {
        const name = document.getElementById('new-name')?.value.trim();
        if (!name) return alert('Enter a student name');
        const db = DB.getData();
        if (db.students.some(s => s.is_active && s.full_name.toLowerCase() === name.toLowerCase())) {
          return alert('A student with this name already exists.');
        }
        const newId = db.students.reduce((max, s) => Math.max(max, s.id), 0) + 1;
        db.students.push({ id: newId, full_name: name, is_active: true });
        DB.save(db);
        this.closeModal();
        this.renderStudents();
      },

      openEditStudentModal(id, currentName) {
        document.getElementById('modal-title').textContent = 'Rename Student';
        document.getElementById('modal-body').innerHTML = `
          <div class="form-group">
            <label class="form-label">New Full Name</label>
            <input type="text" id="edit-name" class="form-input" value="${currentName}" />
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 6px;">
              Past historical session records preserve the snapshot name from submission time.
            </p>
          </div>
          <button class="btn-primary" style="width:100%; margin-top: 8px;" onclick="StandaloneApp.submitRenameStudent(${id})">Save Name</button>
        `;
        this.openModal();
      },

      submitRenameStudent(id) {
        const name = document.getElementById('edit-name')?.value.trim();
        if (!name) return alert('Name cannot be empty');
        const db = DB.getData();
        const student = db.students.find(s => s.id === id);
        if (student) {
          student.full_name = name;
          DB.save(db);
        }
        this.closeModal();
        this.renderStudents();
      },

      archiveStudent(id, name) {
        if (!confirm(`Archive "${name}"?\nPast attendance records will remain preserved.`)) return;
        const db = DB.getData();
        const student = db.students.find(s => s.id === id);
        if (student) {
          student.is_active = false;
          db.tags.device_permission = db.tags.device_permission.filter(tId => tId !== id);
          db.tags.overnight = db.tags.overnight.filter(tId => tId !== id);
          DB.save(db);
        }
        this.renderStudents();
      },

      openManagePermissionsModal(tagType) {
        const isPerm = tagType === 'device_permission';
        const title = isPerm ? 'Manage Device Permissions' : 'Manage Over-Night Exemptions';
        const db = DB.getData();
        const taggedIds = new Set(db.tags[tagType]);
        const activeStudents = this.getActiveStudents();
        const available = activeStudents.filter(s => !taggedIds.has(s.id));
        const currentTagged = activeStudents.filter(s => taggedIds.has(s.id));

        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-body').innerHTML = `
          <div class="form-group" style="margin-bottom: 14px;">
            <label class="form-label">Add Student</label>
            <div style="display:flex; gap: 8px;">
              <select id="tag-select" class="form-input" style="flex:1;">
                <option value="">Select student...</option>
                ${available.map(s => `<option value="${s.id}">${s.full_name}</option>`).join('')}
              </select>
              <button class="btn-primary" style="width:auto; min-width: 80px;" onclick="StandaloneApp.addTag('${tagType}')">Add</button>
            </div>
          </div>
          <div class="history-section">
            <h4 style="font-size: 13px; font-weight: 700; color:var(--text-muted); text-transform:uppercase; margin-bottom: 8px;">
              Currently Active (${currentTagged.length})
            </h4>
            ${currentTagged.length === 0 ? '<p style="color:var(--text-muted); font-size:13px;">None active.</p>' : ''}
            ${currentTagged.map(s => `
              <div class="leaderboard-item">
                <span>${s.full_name}</span>
                <button class="btn-secondary" style="padding: 4px 8px; font-size: 12px; color: var(--status-red);" onclick="StandaloneApp.removeTag(${s.id}, '${tagType}')">
                  Remove
                </button>
              </div>
            `).join('')}
          </div>
        `;
        this.openModal();
      },

      addTag(tagType) {
        const studentId = parseInt(document.getElementById('tag-select')?.value, 10);
        if (!studentId) return alert('Select a student');
        const db = DB.getData();
        if (!db.tags[tagType].includes(studentId)) {
          db.tags[tagType].push(studentId);
          DB.save(db);
        }
        if (this.state.currentTab === 'devices') this.renderDevices();
        if (this.state.currentTab === 'attendance') this.renderAttendance();
        this.openManagePermissionsModal(tagType);
      },

      removeTag(studentId, tagType) {
        const db = DB.getData();
        db.tags[tagType] = db.tags[tagType].filter(id => id !== studentId);
        DB.save(db);
        if (this.state.currentTab === 'devices') this.renderDevices();
        if (this.state.currentTab === 'attendance') this.renderAttendance();
        this.openManagePermissionsModal(tagType);
      },

      openBulkImportModal() {
        document.getElementById('modal-title').textContent = 'Bulk Student Import';
        document.getElementById('modal-body').innerHTML = `
          <div class="form-group">
            <label class="form-label">Paste Names (One per line — Supports 47+ students)</label>
            <textarea id="bulk-paste" class="form-textarea" placeholder="Paste one student name per line"></textarea>
          </div>
          <button class="btn-primary" style="width:100%;" onclick="StandaloneApp.previewBulkImport()">Preview Import</button>
          <div id="bulk-preview-area" style="margin-top: 14px; display:none;"></div>
        `;
        this.openModal();
      },

      previewBulkImport() {
        const raw = document.getElementById('bulk-paste')?.value || '';
        const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length === 0) return alert('Please enter at least one name');

        const db = DB.getData();
        const existing = new Set(db.students.filter(s => s.is_active).map(s => s.full_name.toLowerCase()));
        const seenInBatch = new Set();

        const items = [];
        let validCount = 0;
        let dupCount = 0;

        lines.forEach(name => {
          const lower = name.toLowerCase();
          if (existing.has(lower) || seenInBatch.has(lower)) {
            dupCount++;
            items.push({ name, status: 'duplicate' });
          } else {
            validCount++;
            seenInBatch.add(lower);
            items.push({ name, status: 'valid' });
          }
        });

        const previewDiv = document.getElementById('bulk-preview-area');
        previewDiv.style.display = 'block';
        previewDiv.innerHTML = `
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom: 12px;">
            <div class="stat-chip" style="font-size:12px; padding:6px; background:#F1F5F9; border:1px solid #CBD5E1;">Total: ${lines.length}</div>
            <div class="stat-chip stat-chip-green" style="font-size:12px; padding:6px;">Valid: ${validCount}</div>
            <div class="stat-chip stat-chip-red" style="font-size:12px; padding:6px;">Dups: ${dupCount}</div>
          </div>
          <div style="max-height: 180px; overflow-y: auto; background: #fff; border-radius: 10px; padding: 10px; margin-bottom: 12px; border: 1px solid var(--brand-border);">
            ${items.map(it => `
              <div style="display:flex; justify-content:space-between; padding: 5px 0; font-size:13px; border-bottom: 1px solid var(--brand-border-subtle);">
                <span>${it.name}</span>
                <span style="font-size:11px; font-weight:700; color: ${it.status === 'valid' ? 'var(--status-green)' : 'var(--status-red)'};">
                  ${it.status === 'valid' ? '✓ Ready' : '✕ Dup'}
                </span>
              </div>
            `).join('')}
          </div>
          ${validCount > 0 ? `
            <button class="btn-primary btn-success" style="width:100%;" onclick="StandaloneApp.executeBulkImport(${JSON.stringify(items.filter(it => it.status === 'valid').map(it => it.name)).replace(/"/g, '&quot;')})">
              Import ${validCount} Students Now
            </button>
          ` : '<p style="color:var(--status-red); font-size:13px; text-align:center;">No new unique students to import.</p>'}
        `;
      },

      executeBulkImport(names) {
        const db = DB.getData();
        let maxId = db.students.reduce((max, s) => Math.max(max, s.id), 0);
        names.forEach(name => {
          maxId++;
          db.students.push({ id: maxId, full_name: name, is_active: true });
        });
        DB.save(db);
        this.closeModal();
        this.renderStudents();
        alert(`Successfully imported ${names.length} students!`);
      },

      exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(localStorage.getItem(DB.KEY));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `dorm_check_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      },

      openModal() { document.getElementById('modal-overlay').classList.add('open'); },
      closeModal() { document.getElementById('modal-overlay').classList.remove('open'); },
      renderCurrentTab() {
        if (this.state.currentTab === 'devices') this.renderDevices();
        else if (this.state.currentTab === 'attendance') this.renderAttendance();
        else if (this.state.currentTab === 'history') this.renderHistory();
        else if (this.state.currentTab === 'students') this.renderStudents();
      }
    };

    document.addEventListener('DOMContentLoaded', () => StandaloneApp.init());
  </script>
</body>
</html>
